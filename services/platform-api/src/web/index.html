<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>Rokela Bai Bureh Warrior</title>
    <link rel="icon" type="image/png" href="/rokela-icon.png" />
    <link rel="apple-touch-icon" href="/rokela-icon.png" />
    <link rel="stylesheet" href="/portal.css" />
    <script type="module" src="/portal.mjs"></script>
  </head>
  <body>
    <a class="skip" href="#content">Skip to content</a>
    <div id="shell">
      <header class="global-header">
        <a class="brand" href="/">
          <img src="/rokela-icon.png" alt="" width="32" height="32" />
          <span>Bai Bureh Warrior<small>ROKELA · QUANTIX SIERRA LEONE</small></span>
        </a>
        <button
          id="menu-toggle"
          class="mobile-menu"
          type="button"
          aria-controls="navigation"
          aria-expanded="false"
        >
          Menu
        </button>
        <label class="org-label"
          >Workspace<select id="organization" aria-label="Current organization"></select
        ></label>
        <span id="identity"></span><button id="signout" hidden>Sign out</button>
      </header>
      <aside>
        <p class="nav-caption">WORKSPACE</p>
        <nav aria-label="Main navigation" id="navigation"></nav>
        <p class="rail-note">Your software.<br />Your permissions.<br />One workspace.</p>
      </aside>
      <div class="workspace">
        <div class="workspace-path" id="workspace-path" hidden></div>
        <div id="notice" role="status" aria-live="polite"></div>
        <main id="content" tabindex="-1"></main>
        <footer>Quantix Sierra Leone · Bai Bureh Warrior</footer>
      </div>
    </div>
    <dialog id="modal">
      <div id="modal-content"></div>
      <button id="close-modal">Close</button>
    </dialog>
    <noscript>Enable JavaScript to use the customer portal.</noscript>
  </body>
</html>
