<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>Trust Platform</title>
    <link rel="stylesheet" href="/portal.css" />
    <script type="module" src="/portal.mjs"></script>
  </head>
  <body>
    <a class="skip" href="#content">Skip to content</a>
    <div id="shell">
      <aside>
        <a class="brand" href="/"
          >◈ <span>Trust<br />Platform</span></a
        >
        <nav aria-label="Main navigation" id="navigation"></nav>
        <p class="rail-note">Your software.<br />Your permissions.<br />One workspace.</p>
      </aside>
      <div class="workspace">
        <header>
          <label class="org-label"
            >Workspace<select id="organization" aria-label="Current organization"></select></label
          ><span id="identity"></span><button id="signout" hidden>Sign out</button>
        </header>
        <div id="notice" role="status" aria-live="polite"></div>
        <main id="content" tabindex="-1"></main>
        <footer>Trust Platform · Secure software licensing</footer>
      </div>
    </div>
    <dialog id="modal">
      <div id="modal-content"></div>
      <button id="close-modal">Close</button>
    </dialog>
    <noscript>Enable JavaScript to use the customer portal.</noscript>
  </body>
</html>
