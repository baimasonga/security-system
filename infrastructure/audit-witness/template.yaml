AWSTemplateFormatVersion: '2010-09-09'
Description: Independent Warrior audit witness. Deploy only in the approved separate account.
Parameters:
  RetentionDays:
    Type: Number
    MinValue: 1
    MaxValue: 3650
    Description: Explicit COMPLIANCE retention commitment; cannot shorten existing retained versions.
  CodeBucket:
    Type: String
    Description: Private deployment artifact bucket in this account and region.
  CodeKey:
    Type: String
    Description: Key of the reviewed ZIP containing index.mjs.
  TokenSecretArn:
    Type: String
    AllowedPattern: 'arn:aws:secretsmanager:[a-z0-9-]+:[0-9]{12}:secret:.+'
    Description: Pre-existing private secret with JSON field token (32-256 printable characters).
Resources:
  Evidence:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      VersioningConfiguration: { Status: Enabled }
      ObjectLockEnabled: true
      ObjectLockConfiguration:
        ObjectLockEnabled: Enabled
        Rule:
          DefaultRetention:
            Mode: COMPLIANCE
            Days: { Ref: RetentionDays }
      OwnershipControls:
        Rules: [{ ObjectOwnership: BucketOwnerEnforced }]
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
  EvidencePolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: { Ref: Evidence }
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - { Fn::GetAtt: [Evidence, Arn] }
              - { Fn::Sub: '${Evidence.Arn}/*' }
            Condition: { Bool: { 'aws:SecureTransport': 'false' } }
          - Effect: Deny
            Principal: '*'
            Action: 's3:PutObject'
            Resource: { Fn::Sub: '${Evidence.Arn}/anchors/*' }
            Condition: { StringNotEquals: { 's3:if-none-match': '*' } }
          - Effect: Deny
            Principal: '*'
            Action: ['s3:DeleteObject', 's3:DeleteObjectVersion']
            Resource: { Fn::Sub: '${Evidence.Arn}/anchors/*' }
  ReceiverRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: 'sts:AssumeRole'
      Policies:
        - PolicyName: AppendAndInspectRetainedEvidence
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  ['s3:PutObject', 's3:GetObject', 's3:GetObjectVersion', 's3:GetObjectRetention']
                Resource: { Fn::Sub: '${Evidence.Arn}/anchors/*' }
  Receiver:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: nodejs22.x
      Handler: index.handler
      Role: { Fn::GetAtt: [ReceiverRole, Arn] }
      Code:
        S3Bucket: { Ref: CodeBucket }
        S3Key: { Ref: CodeKey }
      MemorySize: 256
      Timeout: 10
      ReservedConcurrentExecutions: 2
      Environment:
        Variables:
          WITNESS_BUCKET: { Ref: Evidence }
          WITNESS_RETENTION_DAYS: { Ref: RetentionDays }
          WITNESS_TOKEN:
            { Fn::Sub: '{{resolve:secretsmanager:${TokenSecretArn}:SecretString:token}}' }
  Api:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      ProtocolType: HTTP
      Name: warrior-independent-witness
  Integration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: { Ref: Api }
      IntegrationType: AWS_PROXY
      IntegrationUri: { Fn::GetAtt: [Receiver, Arn] }
      PayloadFormatVersion: '2.0'
      TimeoutInMillis: 10000
  Route:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: { Ref: Api }
      RouteKey: POST /anchors
      Target: { Fn::Join: ['/', ['integrations', { Ref: Integration }]] }
  Stage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: { Ref: Api }
      StageName: '$default'
      AutoDeploy: true
      DefaultRouteSettings:
        ThrottlingBurstLimit: 5
        ThrottlingRateLimit: 2
  Invocation:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: { Ref: Receiver }
      Principal: apigateway.amazonaws.com
      SourceArn:
        { Fn::Sub: 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${Api}/*/POST/anchors' }
Outputs:
  WitnessUrl:
    Value: { Fn::Sub: 'https://${Api}.execute-api.${AWS::Region}.amazonaws.com/anchors' }
  EvidenceBucket:
    Value: { Ref: Evidence }
