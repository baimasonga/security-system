            schema: { type: string, pattern: '^[A-Za-z0-9_-]{43}$' },
          }
      requestBody: { $ref: '#/components/requestBodies/PublicComment' }
      responses:
        '201': { description: Comment }
  /v1/public/shares/{token}/review:
    post:
      tags: [sharing]
      summary: Approve or request changes
      security: []
      parameters:
        - {
            name: token,
            in: path,
            required: true,
            schema: { type: string, pattern: '^[A-Za-z0-9_-]{43}$' },
          }
      requestBody: { $ref: '#/components/requestBodies/PublicDecision' }
      responses:
        '200': { description: Decision }
  /v1/public/upload-requests/{token}/open:
    post:
      tags: [sharing]
      summary: Open an upload request - requirements, deadline, limits and a grant
      security: []
      parameters:
        - {
            name: token,
            in: path,
            required: true,
            schema: { type: string, pattern: '^[A-Za-z0-9_-]{43}$' },
          }
      requestBody: { $ref: '#/components/requestBodies/PublicPassword' }
      responses:
        '200': { description: Request }
        '410': { description: Closed or past deadline }
  /v1/public/upload-requests/{token}/submissions:
    post:
      tags: [sharing]
      summary: Start a submission; returns a submission secret the uploader keeps (only its hash is stored)
      security: []
      parameters:
        - {
            name: token,
            in: path,
            required: true,
            schema: { type: string, pattern: '^[A-Za-z0-9_-]{43}$' },
          }
      requestBody: { $ref: '#/components/requestBodies/PublicSubmission' }
      responses:
        '201': { description: Submission id and secret }
  /v1/public/upload-requests/{token}/submission:
    get:
      tags: [sharing]
      summary: The submitter's own files only (x-submission-secret header)
      security: []
      parameters:
        - {
            name: token,
            in: path,
            required: true,
            schema: { type: string, pattern: '^[A-Za-z0-9_-]{43}$' },
          }
      responses:
        '200': { description: Own submission }
  /v1/public/upload-requests/{token}/submission/submit:
    post:
      tags: [sharing]
      summary: Send the submission once required files are present
      security: []
      parameters:
        - {
            name: token,
            in: path,
            required: true,
            schema: { type: string, pattern: '^[A-Za-z0-9_-]{43}$' },
          }
      requestBody: { $ref: '#/components/requestBodies/Empty' }
      responses:
        '200': { description: Submitted }
        '409': { description: Missing required files }
  /v1/public/upload-requests/{token}/uploads:
    post:
      tags: [sharing]
      summary: Begin a resumable upload for a requirement (type, size and storage limits apply)
      security: []
      parameters:
        - {
            name: token,
            in: path,
            required: true,
            schema: { type: string, pattern: '^[A-Za-z0-9_-]{43}$' },
          }
      requestBody: { $ref: '#/components/requestBodies/PublicSubmissionUpload' }
      responses:
        '201': { description: Upload session }
  /v1/public/upload-requests/{token}/uploads/{uploadId}/parts:
    post:
      tags: [sharing]
      summary: Signed part URLs
      security: []
      parameters:
        - {
            name: token,
            in: path,
            required: true,
            schema: { type: string, pattern: '^[A-Za-z0-9_-]{43}$' },
          }
        - { name: uploadId, in: path, required: true, schema: { type: string } }
      requestBody: { $ref: '#/components/requestBodies/SharingParts' }
      responses:
        '200': { description: Signed part URLs }
  /v1/public/upload-requests/{token}/uploads/{uploadId}:
    get:
      tags: [sharing]
      summary: Resume point
      security: []
      parameters:
        - {
            name: token,
            in: path,
            required: true,
            schema: { type: string, pattern: '^[A-Za-z0-9_-]{43}$' },
          }
        - { name: uploadId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Upload status }
  /v1/public/upload-requests/{token}/uploads/{uploadId}/complete:
    post:
      tags: [sharing]
      summary: Complete; enters quarantine
      security: []
      parameters:
        - {
            name: token,
            in: path,
            required: true,
            schema: { type: string, pattern: '^[A-Za-z0-9_-]{43}$' },
          }
        - { name: uploadId, in: path, required: true, schema: { type: string } }
      requestBody: { $ref: '#/components/requestBodies/Empty' }
      responses:
        '200': { description: Processing }
  /v1/public/upload-requests/{token}/uploads/{uploadId}/abort:
    post:
      tags: [sharing]
      summary: Cancel an unfinished upload
      security: []
      parameters:
        - {
            name: token,
            in: path,
            required: true,
            schema: { type: string, pattern: '^[A-Za-z0-9_-]{43}$' },
          }
        - { name: uploadId, in: path, required: true, schema: { type: string } }
      requestBody: { $ref: '#/components/requestBodies/Empty' }
      responses:
        '200': { description: Aborted }
  /v1/public/abuse-reports:
    post:
      tags: [sharing]
      summary: Report phishing, malware or spam (same response whether or not the reference exists)
      security: []
      requestBody: { $ref: '#/components/requestBodies/PublicAbuse' }
      responses:
        '202': { description: Received }
  /v1/admin/sharing/abuse-reports:
    get:
      tags: [sharing]
      summary: Abuse reports across tenants for operator review
      security: [{ bearer: [] }]
      parameters:
        - { name: status, in: query, schema: { type: string } }
      responses:
        '200': { description: Reports }
  /v1/admin/sharing/abuse-reports/{id}/resolve:
    post:
      tags: [sharing]
      summary: Suspend the reported item (operator hold) or dismiss; reason required, audited
      security: [{ bearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody: { $ref: '#/components/requestBodies/AdminAbuseResolve' }
      responses:
        '200': { description: Resolved }
  /v1/admin/organizations/{orgId}/sharing/{type}/{id}/hold:
    post:
      tags: [sharing]
      summary: Place or lift an operator hold on a short link, share link or upload request; reason required, audited
      security: [{ bearer: [] }]
      parameters:
        - { $ref: '#/components/parameters/OrgId' }
        - {
            name: type,
            in: path,
            required: true,
            schema: { type: string, enum: [short, share, request] },
          }
        - {
            name: id,
            in: path,
            required: true,
            schema: { type: string, pattern: '^[a-z]{2,4}_[0-9a-f]{24}$' },
          }
      requestBody: { $ref: '#/components/requestBodies/AdminHold' }
      responses:
        '200': { description: Hold state }
components:
  securitySchemes:
    bearer: { type: http, scheme: bearer, description: Opaque session token from /v1/auth/login }
  parameters:
    OrgId:
      {
        name: orgId,
        in: path,
        required: true,
        schema: { type: string, pattern: '^org_[0-9a-f]{24}$' },
      }
    LicenseId:
      {
        name: licenseId,
        in: path,
        required: true,
        schema: { type: string, pattern: '^lic_[0-9a-f]{24}$' },
      }
    RequestId:
      {
        name: requestId,
        in: path,
        required: true,
        schema: { type: string, pattern: '^prq_[0-9a-f]{24}$' },
      }
  requestBodies:
    Reason:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [reason]
            additionalProperties: false
            properties:
              reason: { type: string, minLength: 3, maxLength: 500 }
    PrivilegedDecision:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [reason, code]
            additionalProperties: false
            properties:
              reason: { type: string, minLength: 3, maxLength: 500 }
              code: { type: string, pattern: '^[0-9]{6}$', description: Current authenticator code }
    Empty:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            properties:
    OptionalReason:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            properties:
              reason: { type: string, maxLength: 500 }
    SharingDocument:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [title]
            properties:
              title: { type: string, maxLength: 200 }
              require_approval: { type: boolean }
    SharingExport:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            properties:
              note: { type: string, maxLength: 1000 }
              file_name: { type: string, maxLength: 200 }
    SharingPublish:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [version_id]
            properties:
              version_id: { type: string }
              replacement_note:
                {
                  type: string,
                  maxLength: 1000,
                  description: Explanation shown to recipients of latest links,
                }
    SharingTransfer:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [title, kind]
            properties:
              title: { type: string }
              message: { type: string, maxLength: 2000 }
              kind: { type: string, enum: [temporary, persistent] }
              expires_at: { type: [string, 'null'], format: date-time }
    SharingTransferPatch:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            properties:
              title: { type: string }
              message: { type: [string, 'null'] }
              expires_at: { type: [string, 'null'], format: date-time }
    SharingUpload:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [target, name, size]
            properties:
              target: { type: string, enum: [transfer, replace, draft] }
              transfer_id: { type: string }
              file_id: { type: string, description: File to replace (same type; link preserved) }
              document_id: { type: string }
              name: { type: string, maxLength: 255 }
              folder_path: { type: string, description: Relative folder for folder uploads }
              size: { type: integer, minimum: 1 }
              note: { type: string, maxLength: 1000, description: Replacement explanation }
    SharingParts:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [part_numbers]
            properties:
              part_numbers: { type: array, items: { type: integer, minimum: 1 }, maxItems: 100 }
    SharingOwnerFile:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [type, id]
            properties:
              type: { type: string, enum: [draft, version, transfer_file, submission_file] }
              id: { type: string }
    SharingLink:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [target_type, target_id, permission]
            properties:
              target_type: { type: string, enum: [transfer, document] }
              target_id: { type: string }
              version_mode: { type: string, enum: [latest, fixed] }
              version_id: { type: string }
              permission: { type: string, enum: [view, download, review] }
              password: { type: string, minLength: 8, maxLength: 128 }
              expires_at: { type: string, format: date-time }
              max_downloads: { type: integer, minimum: 1, maximum: 100000 }
              restriction: { type: string, enum: [none, members, recipients] }
              recipients:
                {
                  type: array,
                  items: { type: string },
                  maxItems: 50,
                  description: Verified account emails,
                }
              notify_on_access: { type: boolean }
              label: { type: string, maxLength: 200 }
    SharingLinkPatch:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            properties:
              label: { type: [string, 'null'] }
              expires_at: { type: [string, 'null'], format: date-time }
              max_downloads: { type: [integer, 'null'] }
              password: { type: [string, 'null'] }
              restriction: { type: string, enum: [none, members, recipients] }
              recipients: { type: array, items: { type: string } }
              notify_on_access: { type: boolean }
              permission: { type: string, enum: [view, download, review] }
              version_id: { type: string }
    SharingStatus:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [action]
            properties:
              action: { type: string, enum: [revoke, suspend, resume] }
              reason: { type: string, maxLength: 500 }
    SharingShortLink:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [kind, destination_type]
            properties:
              kind: { type: string, enum: [public, confidential] }
              destination_type: { type: string, enum: [external, share, request] }
              destination_url: { type: string, maxLength: 2048 }
              target_id: { type: string }
              alias: { type: string, description: Public links only }
              domain_id: { type: string }
              expires_at: { type: string, format: date-time }
              password: { type: string }
              require_auth: { type: boolean }
              label: { type: string }
              folder: { type: string }
              tags: { type: array, items: { type: string } }
    SharingShortLinkPatch:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            properties:
              destination_url: { type: string }
              target_id: { type: string }
              reason: { type: string }
              expires_at: { type: [string, 'null'] }
              password: { type: [string, 'null'] }
              require_auth: { type: boolean }
              label: { type: [string, 'null'] }
              folder: { type: string }
              tags: { type: array, items: { type: string } }
    SharingBulk:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [ids, action]
            properties:
              ids: { type: array, items: { type: string }, maxItems: 100 }
              action: { type: string, enum: [revoke, suspend, resume, move, tag, untag] }
              folder: { type: string }
              tag: { type: string }
              reason: { type: string }
    SharingUploadRequest:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [title, requirements, deadline, max_file_bytes, max_total_bytes]
            properties:
              title: { type: string }
              instructions: { type: string, maxLength: 4000 }
              requirements:
                {
                  type: array,
                  maxItems: 20,
                  items:
                    {
                      type: object,
                      additionalProperties: false,
                      required: [key, label],
                      properties:
                        {
                          key: { type: string },
                          label: { type: string },
                          accept: { type: array, items: { type: string } },
                          required: { type: boolean },
                          max_files: { type: integer },
                        },
                    },
                }
              deadline: { type: string, format: date-time }
              max_file_bytes: { type: integer }
              max_total_bytes: { type: integer }
              password: { type: string }
              notify: { type: boolean }
              retention_days: { type: [integer, 'null'] }
    SharingRequestAction:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [action]
            properties:
              action: { type: string, enum: [close, delete] }
    SharingIds:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [ids]
            properties:
              ids: { type: array, items: { type: string }, maxItems: 100 }
    SharingBranding:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [display_name, accent_color]
            properties:
              display_name: { type: string }
              accent_color: { type: string, pattern: '^#[0-9a-fA-F]{6}$' }
    SharingDomain:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [hostname]
            properties:
              hostname: { type: string }
    PublicPassword:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            properties:
              password: { type: string, maxLength: 128 }
    PublicFileUrl:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [grant, file_id, disposition]
            properties:
              grant: { type: string }
              file_id: { type: string }
              disposition: { type: string, enum: [inline, attachment] }
    PublicAcknowledge:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [grant]
            properties:
              grant: { type: string }
              declared_name: { type: string, maxLength: 100 }
    PublicComment:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [grant, body]
            properties:
              grant: { type: string }
              body: { type: string, maxLength: 2000 }
              page: { type: integer }
    PublicDecision:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [grant, decision]
            properties:
              grant: { type: string }
              decision: { type: string, enum: [approved, changes_requested] }
              note: { type: string }
    PublicSubmission:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [grant, name]
            properties:
              grant: { type: string }
              name: { type: string }
              email: { type: string, description: Self-declared, unverified }
    PublicSubmissionUpload:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [requirement_key, name, size]
            properties:
              requirement_key: { type: string }
              name: { type: string }
              size: { type: integer }
    PublicAbuse:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [reference, category]
            properties:
              reference: { type: string, description: Short, share or request URL }
              category: { type: string, enum: [phishing, malware, spam, other] }
              details: { type: string }
              email: { type: string }
    AdminAbuseResolve:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [action, reason]
            properties:
              action: { type: string, enum: [suspend, dismiss] }
              reason: { type: string, minLength: 3, maxLength: 500 }
    AdminHold:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [hold, reason]
            properties:
              hold: { type: boolean }
              reason: { type: string, minLength: 3, maxLength: 500 }
    Credentials:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [email, password]
            properties:
              {
                email: { type: string, maxLength: 254 },
                password: { type: string, minLength: 12, maxLength: 256 },
              }
    DeviceProof:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [activation_id, installation_id, nonce, signature]
            properties:
              activation_id: { type: string }
              installation_id: { type: string }
              nonce:
                {
                  type: string,
                  description: From /v1/devices/challenges (purpose and subject must match),
                }
              signature:
                {
                  type: string,
                  description: 'base64url Ed25519 over the proof message (see DeviceProof message)',
                }
  responses:
    SessionResponse:
      description: '{ token, expires_at, user_id }'
    PrivilegedRequest:
      description: 'A privileged request: id, operation, org_id, target_id, reason, requested_by, created_at, expires_at, status (pending|approved|executing|executed|rejected|cancelled|failed|expired), decided_by, decided_at, decision_reason, break_glass, witnessed_at, witness_anchor, execute_before, executed_at, failure'
    Problem:
      description: Error
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
  schemas:
    Problem:
      type: object
      required: [code, message, request_id]
      properties:
        code:
          type: string
          enum:
            [
              invalid_request,
              unauthenticated,
              forbidden,
              not_found,
              conflict,
              rate_limited,
              invalid_license,
              license_suspended,
              license_revoked,
              license_expired,
              subscription_inactive,
              device_limit_reached,
              invalid_challenge,
              invalid_device_proof,
              device_key_conflict,
              activation_not_found,
              trial_not_available,
              seat_required,
              seat_limit_reached,
              step_up_required,
              quota_exceeded,
              link_unavailable,
              password_required,
              frozen,
              internal,
            ]
        message: { type: string }
        request_id: { type: string }
        details: { type: object }
    Session:
      type: object
      properties:
        {
          token: { type: string },
          expires_at: { type: string, format: date-time },
          user_id: { type: string },
        }
    License:
      type: object
      properties:
        id: { type: string }
        org_id: { type: string }
        product_id: { type: string }
        product_code: { type: [string, 'null'] }
        plan_id:
          type: string
          description: Current subscription plan for a subscription-backed license; issued plan otherwise.
        tier:
          {
            type: [string, 'null'],
            enum: [trial, standard, professional, business, enterprise, null],
          }
        subscription_id: { type: [string, 'null'] }
        kind: { type: string, enum: [subscription, trial, perpetual, canary] }
        state: { type: string, enum: [active, suspended, revoked] }
        status:
          {
            type: string,
            description: '`valid` or the reason the license currently confers nothing',
          }
        expires_at: { type: [string, 'null'] }
        device_limit: { type: [integer, 'null'] }
        active_devices: { type: integer }
        created_at: { type: string }
    EntitlementsResponse:
      type: object
      properties:
        license_id: { type: string }
        status: { type: string }
        entitlements:
          type: [object, 'null']
          properties:
            plan_id: { type: string }
            plan_version: { type: integer }
            tier: { type: string }
            entitlements: { type: object, additionalProperties: { type: [boolean, integer] } }
            capabilities: { type: array, items: { type: string } }
            device_limit: { type: integer }
    Challenge:
      type: object
      properties:
        nonce: { type: string }
        purpose: { type: string, enum: [activate, validate, refresh, deactivate, capability] }
        expires_at: { type: string }
    LeaseGrant:
      type: object
      properties:
        activation_id: { type: string }
        device_id: { type: string }
        license_id: { type: string }
        lease:
          {
            type: string,
            maxLength: 16384,
            description: 'Compact JWS (EdDSA), typ `lease+jws`. Resolved ent/cap snapshots are limited to 8 KiB. Verify before use; see ADR-002 and ADR-013.',
          }
        lease_expires_at: { type: string }
        refresh_after: { type: string }
        entitlements: { type: object }
    TrustBundle:
      type: object
      properties:
        schema: { type: integer, const: 1 }
        keys:
          type: array
          items:
            type: object
            properties:
              kid: { type: string }
              purpose: { type: string }
              state: { type: string, enum: [active, deprecated] }
              jwk:
                {
                  type: object,
                  properties: { kty: { const: OKP }, crv: { const: Ed25519 }, x: { type: string } },
                }
    DeviceProofMessage:
      description: |
        Wire contract (not a JSON body). The device signs the UTF-8 string (Ed25519, base64url):
        `trust-platform/v1/device-proof\n<purpose>\n<nonce>\n<installation_id>\n<subject_id>\n<key thumbprint>`
        where `subject_id` is empty for `activate` and the activation id otherwise.
      type: string
