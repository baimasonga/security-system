openapi: 3.1.0
info:
  title: Software Trust Platform API
  version: 1.0.0-v1
  description: |
    V1 surface: identity (minimal), organizations, licensing, entitlements, device activation, signed offline leases.

    Conventions
    - Versioned under `/v1`. JSON only. Wire format is `snake_case`.
    - Errors are `application/problem+json`: `{ code, message, request_id, details? }`. Codes are stable.
    - Tenant isolation: every customer route is scoped by `{orgId}`. Resources of other tenants return `404`,
      indistinguishable from nonexistent ones.
    - Customer routes use `Authorization: Bearer <session token>` (no cookies, hence no CSRF surface).
    - Device routes (`refresh`, `validate`, `deactivate`) carry no bearer token: they are authenticated by a device
      signature over a single-use challenge (see `DeviceProof`).
    - Mutating operator routes require a `reason` (3–500 chars) which is written to the audit log.
servers:
  - url: https://api.example.test
security: []
tags:
  - { name: auth }
  - { name: organizations }
  - { name: licenses, description: Customer self-service }
  - { name: devices, description: Device-facing protocol }
  - { name: admin, description: Platform operators only }
  - { name: keys }
  - {
      name: sharing,
      description: File sharing,
      documents,
      short links and upload requests (ADR-021; docs/api/sharing.md),
    }
paths:
  /checkout:
    get:
      summary: Isolated Paddle payment-link page; no account session stored here
      security: []
      responses:
        '200': { description: Payment HTML shell }
        '404': { description: Not the configured payment host or billing is disabled }
  /checkout.mjs:
    get:
      summary: Payment-page JavaScript
      security: []
      responses:
        '200': { description: Public payment integration }
  /v1/billing/checkout-options:
    get:
      summary: Public Paddle.js client token and environment; never API credentials
      security: []
      responses:
        '200': { description: Public frontend configuration }
        '503': { description: Payment page not configured }
  /v1/billing/catalog:
    get:
      summary: Configured checkout plan IDs; empty when billing is disabled
      security: [{ bearer: [] }]
      responses:
        '200': { description: Available local plan IDs }
  /v1/organizations/{orgId}/licenses/{licenseId}/checkout:
    parameters:
      - { $ref: '#/components/parameters/OrgId' }
      - { $ref: '#/components/parameters/LicenseId' }
    get:
      summary: Read checkout and subscription state; organization admin or owner required
      security: [{ bearer: [] }]
      responses:
        '200': { description: Checkout state; payment URL only while ready }
        '404': { description: Not found or another tenant }
        '503': { description: Billing is not configured }
    post:
      summary: Reserve one checkout for an existing license; organization admin or owner required
      description: Reuse the same operation ID on retries. Uncertain provider outcomes require reconciliation.
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [plan_id, idempotency_key]
              properties:
                plan_id: { type: string, pattern: '^pln_[A-Za-z0-9_-]+$' }
                idempotency_key: { type: string, pattern: '^[A-Za-z0-9_-]{16,128}$' }
      responses:
        '200': { description: Existing or newly submitted intent; no entitlement grant }
        '409': { description: A different checkout already exists }
        '503': { description: Billing is not configured }
  /v1/admin/organizations/{orgId}/licenses/{licenseId}/checkout/reconcile:
    post:
      summary: Verify a candidate Paddle transaction against an existing intent; operator required
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [transaction_id, reason]
              properties:
                transaction_id: { type: string, pattern: '^txn_[a-z0-9]{26}$' }
                reason: { type: string, minLength: 3, maxLength: 500 }
      responses:
        '200': { description: Verified mapped transaction recorded with audit }
        '404': { description: Intent not found }
        '503': { description: Billing is not configured }
  /v1/billing/webhooks/paddle:
    post:
      summary: Signed raw-byte Paddle notification; never accepts customer session as payment proof
      security: []
      parameters:
        - in: header
          name: Paddle-Signature
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        '200': { description: Applied, duplicate, older or irrelevant event acknowledged }
        '403': { description: Invalid signature or mapped price mismatch }
        '409': { description: Unmapped, ambiguous or conflicting event requires reconciliation }
        '503': { description: Billing is not configured }
  /v1/organizations/{orgId}/licenses/{licenseId}/usage:
    get:
      summary: Current UTC-month quota usage; historical receipts are retained
      security:
        - bearer: []
      responses:
        '200':
          description: License id, period, reset time, commercial status and allowance usage
        '401':
          description: Authentication required
        '404':
          description: Not found or not a member
    post:
      summary: Consume allowance atomically and return an idempotent accounting receipt
      description: Receipt is not a capability or authorization to execute external
        work. The same operation key must also deduplicate execution.
      security:
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - entitlement
                - units
                - idempotency_key
              properties:
                entitlement:
                  type: string
                  pattern: ^[a-z][a-z0-9_]{0,55}_monthly$
                units:
                  type: integer
                  minimum: 1
                  maximum: 1099511627776
                idempotency_key:
                  type: string
                  pattern: ^[A-Za-z0-9_-]{16,128}$
      responses:
        '200':
          description: Accounting receipt (also returned on matching retries)
        '400':
          description: Invalid input
        '401':
          description: Authentication required
        '403':
          description: License or allowance unavailable
        '404':
          description: Not found or not a member
        '409':
          description: Quota exhausted or idempotency payload differs
        '429':
          description: Rate limited
  /v1/auth/mfa/begin:
    post:
      summary: MFA begin
      security:
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - password
              properties:
                password:
                  type: string
                  minLength: 1
                  maxLength: 256
      responses:
        '200':
          description: Manual setup key and ten-minute expiration
        '400':
          description: Invalid input
        '401':
          description: Invalid credentials, code or session
        '409':
          description: MFA unavailable or already enabled
        '429':
          description: Rate limit exceeded
  /v1/auth/mfa/confirm:
    post:
      summary: MFA confirm
      security:
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - password
                - code
              properties:
                password:
                  type: string
                  minLength: 1
                  maxLength: 256
                code:
                  type: string
                  pattern: ^[0-9]{6}$
      responses:
        '200':
          description: Enabled; ten recovery codes shown once; all sessions revoked
        '400':
          description: Invalid input
        '401':
          description: Invalid credentials, code or session
        '409':
          description: MFA unavailable or already enabled
        '429':
          description: Rate limit exceeded
  /v1/auth/mfa/disable:
    post:
      summary: MFA disable
      security:
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - password
                - code
                - reason
              properties:
                password:
                  type: string
                  minLength: 1
                  maxLength: 256
                code:
                  type: string
                  pattern: ^(?:[0-9]{6}|[0-9a-f]{32})$
                reason:
                  type: string
                  minLength: 3
                  maxLength: 500
      responses:
        '204':
          description: Disabled; all sessions revoked
        '400':
          description: Invalid input
        '401':
          description: Invalid credentials, code or session
        '409':
          description: MFA unavailable or already enabled
        '429':
          description: Rate limit exceeded
  /v1/auth/options:
    get:
      summary: auth options
      security: []
      responses:
        '200':
          description: '{ email_recovery_configured, passkeys_configured }'
  # ---- passkeys (ADR-023) ----
  /v1/auth/passkeys/register/begin:
    post:
      summary: Passkey registration options (password re-authentication; 5-minute single-use challenge bound to this session)
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              {
                type: object,
                required: [password],
                additionalProperties: false,
                properties: { password: { type: string, maxLength: 256 } },
              }
      responses:
        {
          '200': { description: PublicKeyCredentialCreationOptions (binary fields base64url) },
          '401': { description: Wrong password },
          '409': { description: Passkeys not configured },
        }
  /v1/auth/passkeys/register/finish:
    post:
      summary: Register the credential (origin, RP, challenge, user verification; attestation not trusted)
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, credential]
              additionalProperties: false
              properties:
                name: { type: string, minLength: 1, maxLength: 100 }
                credential:
                  type: object
                  required: [id, type, response]
                  additionalProperties: false
                  properties:
                    id: { type: string }
                    type: { type: string, enum: [public-key] }
                    response:
                      type: object
                      required: [clientDataJSON, attestationObject]
                      additionalProperties: false
                      properties:
                        { clientDataJSON: { type: string }, attestationObject: { type: string } }
      responses:
        {
          '201': { description: '{ id, name, created_at }' },
          '400': { description: Verification failed },
          '409': { description: Already registered },
        }
  /v1/auth/passkeys/login/begin:
    post:
      summary: Sign-in challenge for discoverable credentials (5 minutes, single use)
      security: []
      requestBody: { $ref: '#/components/requestBodies/Empty' }
      responses:
        {
          '200':
            { description: '{ challenge, rpId, timeout, userVerification, allowCredentials }' },
        }
  /v1/auth/passkeys/login/finish:
    post:
      summary: Sign in with a passkey (signature, origin, RP, user verification, counter); one generic 401 for every failure
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [credential]
              additionalProperties: false
              properties:
                credential:
                  type: object
                  required: [id, type, response]
                  additionalProperties: false
                  properties:
                    id: { type: string }
                    type: { type: string, enum: [public-key] }
                    response:
                      type: object
                      required: [clientDataJSON, authenticatorData, signature]
                      additionalProperties: false
                      properties:
                        clientDataJSON: { type: string }
                        authenticatorData: { type: string }
                        signature: { type: string }
                        userHandle: { type: string }
      responses:
        {
          '200': { $ref: '#/components/responses/SessionResponse' },
          '401': { description: passkey sign-in failed },
        }
  /v1/auth/passkeys:
    get:
      summary: The caller's passkeys (name, created_at, last_used_at, backed_up; never keys)
      security: [{ bearer: [] }]
      responses: { '200': { description: '{ items }' } }
  /v1/auth/passkeys/{credentialId}/delete:
    parameters:
      - {
          name: credentialId,
          in: path,
          required: true,
          schema: { type: string, pattern: '^[A-Za-z0-9_-]+$' },
        }
    post:
      summary: Remove one of the caller's passkeys (password re-authentication)
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              {
                type: object,
                required: [password],
                additionalProperties: false,
                properties: { password: { type: string, maxLength: 256 } },
              }
      responses:
        {
          '204': { description: Removed },
          '401': { description: Wrong password },
          '404': { description: Not yours or unknown },
        }
  /v1/auth/password/request:
    post:
      summary: password request
      security: []
      responses:
        '202':
          description: Generic delivery acceptance
        '400':
          description: Invalid input or invalid/expired token
        '409':
          description: Email delivery not configured
        '429':
          description: Rate limit exceeded
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - email
              properties:
                email:
                  type: string
                  minLength: 1
                  maxLength: 254
  /v1/auth/password/reset:
    post:
      summary: password reset
      security: []
      responses:
        '204':
          description: Completed
        '400':
          description: Invalid input or invalid/expired token
        '429':
          description: Rate limit exceeded
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - token
                - password
              properties:
                token:
                  type: string
                  minLength: 1
                  maxLength: 128
                password:
                  type: string
                  minLength: 12
                  maxLength: 256
  /v1/auth/email/request:
    post:
      summary: email request
      security:
        - bearer: []
      responses:
        '202':
          description: Generic delivery acceptance
        '400':
          description: Invalid input or invalid/expired token
        '401':
          description: Authentication required
        '409':
          description: Email delivery not configured
        '429':
          description: Rate limit exceeded
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
  /v1/auth/email/verify:
    post:
      summary: email verify
      security: []
      responses:
        '204':
          description: Completed
        '400':
          description: Invalid input or invalid/expired token
        '429':
          description: Rate limit exceeded
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - token
              properties:
                token:
                  type: string
                  minLength: 1
                  maxLength: 128
  /:
    get:
      summary: Public portal asset
      security: []
      responses:
        '200':
          description: Portal content with no account or tenant data
          content:
            text/html:
              schema: { type: string }
  /rokela-icon.png:
    get:
      summary: Public Rokela Bai Bureh Warrior brand icon
      security: []
      responses:
        '200':
          description: Public brand artwork with no account or tenant data
          content:
            image/png:
              schema: { type: string, format: binary }
  /portal.css:
    get:
      summary: Public portal asset
      security: []
      responses:
        '200':
          description: Portal content with no account or tenant data
          content:
            text/css:
              schema: { type: string }
  /portal.mjs:
    get:
      summary: Public portal asset
      security: []
      responses:
        '200':
          description: Portal content with no account or tenant data
          content:
            text/javascript:
              schema: { type: string }
  /device.mjs:
    get:
      summary: Public portal asset
      security: []
      responses:
        '200':
          description: Portal content with no account or tenant data
          content:
            text/javascript:
              schema: { type: string }
  /v1/catalog/products:
    get:
      operationId: catalogProducts
      summary: Browse active products
      security: [{ bearer: [] }]
      responses:
        '200':
          description: Active product catalog
        '401':
          description: Authentication required
  /v1/catalog/products/{productId}/plans:
    get:
      operationId: catalogPlans
      summary: Browse a product's plans
      security: [{ bearer: [] }]
      parameters:
        - name: productId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Plan catalog
        '401':
          description: Authentication required
        '404':
          description: Product not found
  /healthz:
    get:
      summary: Liveness
      responses: { '200': { description: ok } }

  /v1/auth/register:
    post:
      tags: [auth]
      summary: Create an account (and its personal organization)
      requestBody: { $ref: '#/components/requestBodies/Credentials' }
      responses:
        '201': { description: Created }
        '400': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
  /v1/auth/login:
    post:
      tags: [auth]
      summary: Create a session. Uniform error for unknown user / wrong password; progressive lockout.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  minLength: 1
                  maxLength: 254
                password:
                  type: string
                  minLength: 1
                  maxLength: 256
                code:
                  type: string
                  pattern: ^(?:[0-9]{6}|[0-9a-f]{32})$
                  description: Required when MFA is enabled. Authenticator code or one unused
                    recovery code.
      responses:
        '200':
          description: Session
          content: { application/json: { schema: { $ref: '#/components/schemas/Session' } } }
        '401': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
  /v1/auth/logout:
    post:
      tags: [auth]
      security: [{ bearer: [] }]
      responses:
        {
          '204': { description: Session revoked },
          '401': { $ref: '#/components/responses/Problem' },
        }
  /v1/auth/me:
    get:
      tags: [auth]
      security: [{ bearer: [] }]
      responses:
        {
          '200': { description: Current principal },
          '401': { $ref: '#/components/responses/Problem' },
        }

  /v1/organizations:
    get:
      tags: [organizations]
      security: [{ bearer: [] }]
      responses:
        {
          '200': { description: Organizations the caller belongs to },
          '401': { $ref: '#/components/responses/Problem' },
        }
    post:
      tags: [organizations]
      security: [{ bearer: [] }]
      responses:
        {
          '201': { description: Created (caller becomes owner) },
          '400': { $ref: '#/components/responses/Problem' },
        }
  /v1/organizations/{orgId}:
    parameters: [{ $ref: '#/components/parameters/OrgId' }]
    get:
      tags: [organizations]
      security: [{ bearer: [] }]
      responses:
        { '200': { description: Organization }, '404': { $ref: '#/components/responses/Problem' } }
  /v1/organizations/{orgId}/members:
    parameters: [{ $ref: '#/components/parameters/OrgId' }]
    get:
      tags: [organizations]
      security: [{ bearer: [] }]
      responses:
        { '200': { description: Members }, '404': { $ref: '#/components/responses/Problem' } }
    post:
      tags: [organizations]
      security: [{ bearer: [] }]
      summary: Add an existing user. Requires owner/admin; cannot grant a role above one's own; not allowed on personal orgs.
      responses:
        '201': { description: Added }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }

  /v1/organizations/{orgId}/licenses:
    parameters: [{ $ref: '#/components/parameters/OrgId' }]
    get:
      tags: [licenses]
      security: [{ bearer: [] }]
      responses:
        '200':
          description: Licenses with effective status (never keys or digests)
          content:
            {
              application/json:
                {
                  schema:
                    {
                      type: object,
                      properties:
                        { items: { type: array, items: { $ref: '#/components/schemas/License' } } },
                    },
                },
            }
        '404': { $ref: '#/components/responses/Problem' }
  /v1/organizations/{orgId}/licenses/{licenseId}:
    parameters:
      [{ $ref: '#/components/parameters/OrgId' }, { $ref: '#/components/parameters/LicenseId' }]
    get:
      tags: [licenses]
      security: [{ bearer: [] }]
      responses:
        '200':
          {
            description: License,
            content: { application/json: { schema: { $ref: '#/components/schemas/License' } } },
          }
        '404': { $ref: '#/components/responses/Problem' }
  /v1/organizations/{orgId}/licenses/{licenseId}/activations:
    parameters:
      [{ $ref: '#/components/parameters/OrgId' }, { $ref: '#/components/parameters/LicenseId' }]
    get:
      tags: [licenses]
      security: [{ bearer: [] }]
      summary: Active and past device activations for a license
      responses:
        { '200': { description: Activations }, '404': { $ref: '#/components/responses/Problem' } }
  /v1/organizations/{orgId}/activations/{activationId}/deactivate:
    parameters:
      - { $ref: '#/components/parameters/OrgId' }
      - { name: activationId, in: path, required: true, schema: { type: string } }
    post:
      tags: [licenses]
      security: [{ bearer: [] }]
      summary: Free a device slot. Owners/admins any device; members only devices they activated. Idempotent.
      responses:
        '200': { description: Deactivated }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /v1/security-center:
    get:
      summary: 'Security center (ADR-027): account protection, roles with plain-language permissions, your own devices with trust posture, collected data categories and retention, recommendations'
      security: [{ bearer: [] }]
      responses:
        {
          '200':
            {
              description: '{ account, organizations, devices, data_categories, recommendations }',
            },
        }
  /v1/telemetry/events:
    post:
      summary: 'Client telemetry through the privacy firewall (ADR-027): only allow-listed events and fields; values that look like personal data, paths, URLs, secrets, card numbers or key material are refused. Refusals name the field and rule, never the value. No user reference is stored.'
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [events]
              additionalProperties: false
              properties:
                events:
                  type: array
                  minItems: 1
                  maxItems: 50
                  items:
                    type: object
                    required: [name]
                    additionalProperties: false
                    properties:
                      name: { type: string, enum: [app.started, feature.used, app.error] }
                      attributes: { type: object }
      responses:
        {
          '200':
            { description: '{ accepted, rejected: [{ index, violations: [{ field, rule }] }] }' },
        }
  /v1/organizations/{orgId}/devices/{deviceId}/passport:
    parameters:
      - { $ref: '#/components/parameters/OrgId' }
      - { name: deviceId, in: path, required: true, schema: { type: string } }
    get:
      summary: 'Device passport (ADR-026): key identity, attestation status (unknown unless verified), server-observed signals (90-day retention) and posture'
      security: [{ bearer: [] }]
      responses:
        {
          '200':
            {
              description: '{ device_id, key, attestation, posture: { decision, reasons, review_at, mode }, signals }',
            },
          '404': { description: Not a member, or unknown device },
        }
  /v1/organizations/{orgId}/licenses/{licenseId}/seats:
    parameters:
      [{ $ref: '#/components/parameters/OrgId' }, { $ref: '#/components/parameters/LicenseId' }]
    get:
      summary: Seats on this license (ADR-025); limit is null for licenses that are not seat-based
      security: [{ bearer: [] }]
      responses:
        {
          '200': { description: '{ limit, used, items: [{ user_id, assigned_by, assigned_at }] }' },
          '404': { description: Not a member },
        }
    post:
      summary: Give a member a seat (admins and owners; under the license lock)
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              {
                type: object,
                required: [user_id],
                additionalProperties: false,
                properties: { user_id: { type: string } },
              }
      responses:
        {
          '201': { description: '{ user_id, assigned_by, assigned_at, limit, used }' },
          '403': { description: Not an admin },
          '404': { description: Not a member, or the person is not a member },
          '409': { description: 'Not seat-based, already assigned, or seat_limit_reached' },
          '423': { description: Organization frozen },
        }
  /v1/organizations/{orgId}/licenses/{licenseId}/seats/{userId}/unassign:
    parameters:
      - { $ref: '#/components/parameters/OrgId' }
      - { $ref: '#/components/parameters/LicenseId' }
      - { name: userId, in: path, required: true, schema: { type: string } }
    post:
      summary: Remove a seat and deactivate that person's devices on the license; reports how long offline leases stay valid
      security: [{ bearer: [] }]
      requestBody: { $ref: '#/components/requestBodies/Empty' }
      responses:
        {
          '200':
            { description: '{ user_id, activations_deactivated, offline_leases_valid_until }' },
          '403': { description: Not an admin },
          '404': { description: No such seat },
        }
  /v1/organizations/{orgId}/trials:
    parameters: [{ $ref: '#/components/parameters/OrgId' }]
    post:
      tags: [licenses]
      security: [{ bearer: [] }]
      summary: Start the product trial. One per (product, org) and per (product, user), recorded server-side.
      responses:
        '201': { description: 'Trial license; `license_key` is shown once' }
        '409': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /v1/entitlements:
    get:
      tags: [licenses]
      security: [{ bearer: [] }]
      summary: Resolved entitlements/capabilities for a license, or `status` explaining why there are none
      parameters:
        - { name: org_id, in: query, required: true, schema: { type: string } }
        - { name: license_id, in: query, required: true, schema: { type: string } }
      responses:
        '200':
          {
            description: Entitlements,
            content:
              {
                application/json: { schema: { $ref: '#/components/schemas/EntitlementsResponse' } },
              },
          }
        '404': { $ref: '#/components/responses/Problem' }

  /v1/devices/challenges:
    post:
      tags: [devices]
      summary: Issue a single-use, purpose-bound challenge (5 min TTL, capped per installation)
      responses:
        '201':
          {
            description: Challenge,
            content: { application/json: { schema: { $ref: '#/components/schemas/Challenge' } } },
          }
        '400': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
  /v1/licenses/activate:
    post:
      tags: [devices]
      security: [{ bearer: [] }]
      summary: Activate a device. Needs session + license key + proof of possession; the key alone is never authority.
      description: |
        Failures that would reveal whether a key exists/belongs to someone else (unknown key, non-member,
        canary) are all `403 invalid_license "invalid license"`.
      responses:
        '200':
          {
            description: Lease grant,
            content: { application/json: { schema: { $ref: '#/components/schemas/LeaseGrant' } } },
          }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /v1/licenses/validate:
    post:
      tags: [devices]
      summary: Online validation, authenticated by DeviceProof. Returns state, no new lease.
      requestBody: { $ref: '#/components/requestBodies/DeviceProof' }
      responses:
        '200': { description: Valid }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /v1/licenses/refresh:
    post:
      tags: [devices]
      summary: Obtain a fresh lease (reflects current plan version, subscription and revocation state)
      requestBody: { $ref: '#/components/requestBodies/DeviceProof' }
      responses:
        '200':
          {
            description: Lease grant,
            content: { application/json: { schema: { $ref: '#/components/schemas/LeaseGrant' } } },
          }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /v1/capabilities/token:
    post:
      tags: [devices]
      summary: 'Short-lived (default 5 min, max 15) device-bound token for ONE capability of the resolved plan, for a processing service (ADR-024). Device-proved with a challenge of purpose capability. JWS typ cap+jws, aud svc:<service>; verify with verifyCapabilityToken.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [activation_id, installation_id, nonce, signature, capability, service]
              additionalProperties: false
              properties:
                activation_id: { type: string }
                installation_id: { type: string }
                nonce: { type: string }
                signature: { type: string }
                capability: { type: string, pattern: '^[A-Z][A-Z0-9_]{0,63}$' }
                service: { type: string, pattern: '^[a-z][a-z0-9-]{0,39}$' }
      responses:
        '200': { description: '{ token, expires_at, capability, audience }' }
        '403': { description: 'Capability not granted, license not valid, or device proof invalid' }
  /v1/licenses/deactivate:
    post:
      tags: [devices]
      summary: Device releases its own slot (works even when the license has lapsed)
      requestBody: { $ref: '#/components/requestBodies/DeviceProof' }
      responses:
        {
          '200': { description: Deactivated },
          '403': { $ref: '#/components/responses/Problem' },
          '404': { $ref: '#/components/responses/Problem' },
        }
  /v1/keys/trust-bundle:
    get:
      tags: [keys]
      summary: Public verification keys for leases (active + deprecated). Contains no secrets.
      responses:
        {
          '200':
            {
              description: Trust bundle,
              content:
                { application/json: { schema: { $ref: '#/components/schemas/TrustBundle' } } },
            },
        }

  /v1/admin/products:
    post:
      tags: [admin]
      security: [{ bearer: [] }]
      responses:
        {
          '201': { description: Created },
          '403': { $ref: '#/components/responses/Problem' },
          '409': { $ref: '#/components/responses/Problem' },
        }
  /v1/admin/products/{productId}/plans:
    parameters: [{ name: productId, in: path, required: true, schema: { type: string } }]
    post:
      tags: [admin]
      security: [{ bearer: [] }]
      responses:
        { '201': { description: Created }, '403': { $ref: '#/components/responses/Problem' } }
  /v1/admin/plans/{planId}:
    parameters: [{ name: planId, in: path, required: true, schema: { type: string } }]
    patch:
      tags: [admin]
      security: [{ bearer: [] }]
      summary: Bumps the plan version; reaches devices on their next refresh (no client release)
      responses:
        { '200': { description: Updated }, '403': { $ref: '#/components/responses/Problem' } }
  /v1/admin/organizations/{orgId}/subscriptions:
    parameters: [{ $ref: '#/components/parameters/OrgId' }]
    post:
      tags: [admin]
      security: [{ bearer: [] }]
      responses:
        { '201': { description: Created }, '403': { $ref: '#/components/responses/Problem' } }
  /v1/admin/organizations/{orgId}/subscriptions/{subscriptionId}:
    parameters:
      - { $ref: '#/components/parameters/OrgId' }
      - { name: subscriptionId, in: path, required: true, schema: { type: string } }
    patch:
      description: Plan changes stay within the same product and apply to subsequent lease issuance and online entitlement reads. Existing offline leases retain their bounded lifetime.
      tags: [admin]
      security: [{ bearer: [] }]
      responses:
        { '200': { description: Updated }, '403': { $ref: '#/components/responses/Problem' } }
  /v1/admin/organizations/{orgId}/licenses:
    parameters: [{ $ref: '#/components/parameters/OrgId' }]
    get:
      tags: [admin]
      security: [{ bearer: [] }]
      responses: { '200': { description: Licenses (including canaries) } }
    post:
      tags: [admin]
      security: [{ bearer: [] }]
      summary: Issue a license. The plaintext `license_key` is returned exactly once.
      responses:
        { '201': { description: Issued }, '403': { $ref: '#/components/responses/Problem' } }
  /v1/admin/organizations/{orgId}/licenses/{licenseId}/activations:
    parameters:
      [{ $ref: '#/components/parameters/OrgId' }, { $ref: '#/components/parameters/LicenseId' }]
    get:
      tags: [admin]
      security: [{ bearer: [] }]
      responses: { '200': { description: Activations } }
  /v1/admin/organizations/{orgId}/licenses/{licenseId}/suspend:
    parameters:
      [{ $ref: '#/components/parameters/OrgId' }, { $ref: '#/components/parameters/LicenseId' }]
    post:
      tags: [admin]
      security: [{ bearer: [] }]
      responses:
        { '200': { description: Suspended }, '409': { $ref: '#/components/responses/Problem' } }
  /v1/admin/organizations/{orgId}/licenses/{licenseId}/reinstate:
    parameters:
      [{ $ref: '#/components/parameters/OrgId' }, { $ref: '#/components/parameters/LicenseId' }]
    post:
      tags: [admin]
      security: [{ bearer: [] }]
      responses:
        { '200': { description: Reinstated }, '409': { $ref: '#/components/responses/Problem' } }
  /v1/admin/organizations/{orgId}/licenses/{licenseId}/revoke:
    parameters:
      [{ $ref: '#/components/parameters/OrgId' }, { $ref: '#/components/parameters/LicenseId' }]
    post:
      tags: [admin]
      security: [{ bearer: [] }]
      summary: Terminal. Also revokes all activations of the license.
      responses:
        { '200': { description: Revoked }, '409': { $ref: '#/components/responses/Problem' } }
  /v1/admin/organizations/{orgId}/devices/{deviceId}/passport:
    parameters:
      - { $ref: '#/components/parameters/OrgId' }
      - { name: deviceId, in: path, required: true, schema: { type: string } }
    get:
      tags: [admin]
      security: [{ bearer: [] }]
      summary: Device passport for operators (ADR-026)
      responses: { '200': { description: The passport }, '404': { description: Unknown device } }
  /v1/admin/audit:
    get:
      tags: [admin]
      security: [{ bearer: [] }]
      parameters:
        - { name: org_id, in: query, schema: { type: string } }
        - { name: action, in: query, schema: { type: string } }
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 500, default: 100 },
          }
      responses: { '200': { description: Audit events (hash-chained) } }
  /v1/admin/metrics:
    get:
      tags: [admin]
      security: [{ bearer: [] }]
      summary: Operational metrics (request/transaction latency, retries, audit-lock wait, pool, process). Labels are route templates and enumerated outcomes only.
      parameters:
        - {
            name: format,
            in: query,
            schema: { type: string, enum: [json, prometheus], default: json },
          }
      responses: { '200': { description: Metrics snapshot } }
  /v1/admin/audit/verify:
    get:
      tags: [admin]
      security: [{ bearer: [] }]
      summary: Verify the partitioned audit hash chains and their heads (ADR-008); optionally only one organization's chains
      parameters:
        - { name: org_id, in: query, schema: { type: string } }
      responses:
        {
          '200':
            {
              description: '{ ok: true, count, chains, anchor } or { ok: false, chain, broken_at_seq, reason }. anchor is a digest of the verified chain heads, to be witnessed externally.',
            },
        }

  /v1/admin/audit/anchors:
    get:
      tags: [admin]
      security: [{ bearer: [] }]
      summary: Recent audit anchors published to the external witness (metadata only; ADR-010)
      parameters:
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 200, default: 20 },
          }
      responses:
        {
          '200':
            {
              description: '{ configured, destination, items[] } newest first; each item has anchor, chains, events, status, receipt, error',
            },
        }
    post:
      tags: [admin]
      security: [{ bearer: [] }]
      summary: Verify the whole audit log and publish its anchor to the witness now (operator, reason required, audited)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              {
                type: object,
                required: [reason],
                additionalProperties: false,
                properties: { reason: { type: string } },
              }
      responses:
        {
          '200':
            {
              description: 'The anchor record (status published or failed), or { status: chain_invalid, chain, broken_at_seq, reason } when the log failed verification and was NOT anchored',
            },
          '409': { description: External anchoring is not configured },
        }
  /v1/admin/audit/anchors/check:
    post:
      tags: [admin]
      security: [{ bearer: [] }]
      summary: Check the live log against a manifest held by the witness (read-only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              {
                type: object,
                required: [manifest],
                additionalProperties: false,
                properties:
                  {
                    manifest:
                      {
                        type: object,
                        required: [v, created_at, anchor, chains],
                        additionalProperties: false,
                        properties:
                          {
                            v: { type: integer, enum: [1] },
                            created_at: { type: string },
                            anchor: { type: string },
                            chains: { type: array, maxItems: 5000, items: { type: object } },
                          },
                      },
                  },
              }
      responses:
        {
          '200':
            {
              description: '{ ok: true, chains } or { ok: false, stage: log|witness, chain, seq, reason }',
            },
        }

  # ---- privileged operations (ADR-022) ----
  /v1/admin/privileged/requests:
    post:
      tags: [admin]
      security: [{ bearer: [] }]
      summary: Request a privileged operation (dual control / JIT grant). The target is validated and stored; execution uses the stored target only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - {
                    type: object,
                    required: [operation, org_id, license_id, reason],
                    additionalProperties: false,
                    properties:
                      {
                        operation: { type: string, enum: [license.revoke] },
                        org_id: { type: string },
                        license_id: { type: string },
                        reason: { type: string, minLength: 3, maxLength: 500 },
                      },
                  }
                - {
                    type: object,
                    required: [operation, user_id, reason],
                    additionalProperties: false,
                    properties:
                      {
                        operation: { type: string, enum: [operator.grant, operator.revoke] },
                        user_id: { type: string },
                        reason: { type: string, minLength: 3, maxLength: 500 },
                      },
                  }
                - {
                    type: object,
                    required: [operation, org_id, reason],
                    additionalProperties: false,
                    properties:
                      {
                        operation: { type: string, enum: [org.unfreeze] },
                        org_id: { type: string },
                        reason: { type: string, minLength: 3, maxLength: 500 },
                      },
                  }
                - {
                    type: object,
                    required: [operation, reason],
                    additionalProperties: false,
                    properties:
                      {
                        operation: { type: string, enum: [platform.unfreeze] },
                        reason: { type: string, minLength: 3, maxLength: 500 },
                      },
                  }
      responses:
        {
          '201': { $ref: '#/components/responses/PrivilegedRequest' },
          '404': { $ref: '#/components/responses/Problem' },
          '409': { $ref: '#/components/responses/Problem' },
        }
    get:
      tags: [admin]
      security: [{ bearer: [] }]
      summary: Privileged requests, newest first
      parameters:
        - {
            name: status,
            in: query,
            schema:
              {
                type: string,
                enum:
                  [pending, approved, executing, executed, rejected, cancelled, failed, expired],
              },
          }
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 200, default: 50 },
          }
      responses: { '200': { description: '{ items: [PrivilegedRequest] }' } }
  /v1/admin/privileged/requests/{requestId}:
    parameters: [{ $ref: '#/components/parameters/RequestId' }]
    get:
      tags: [admin]
      security: [{ bearer: [] }]
      responses:
        {
          '200': { $ref: '#/components/responses/PrivilegedRequest' },
          '404': { $ref: '#/components/responses/Problem' },
        }
  /v1/admin/privileged/requests/{requestId}/approve:
    parameters: [{ $ref: '#/components/parameters/RequestId' }]
    post:
      tags: [admin]
      security: [{ bearer: [] }]
      summary: Approve as a distinct operator with a fresh authenticator code (step-up; recovery codes not accepted). Opens a one-hour grant for the requester.
      requestBody: { $ref: '#/components/requestBodies/PrivilegedDecision' }
      responses:
        {
          '200': { $ref: '#/components/responses/PrivilegedRequest' },
          '401': { description: Invalid or replayed code },
          '403': { description: Own request, or MFA not enabled },
          '409': { $ref: '#/components/responses/Problem' },
        }
  /v1/admin/privileged/requests/{requestId}/reject:
    parameters: [{ $ref: '#/components/parameters/RequestId' }]
    post:
      tags: [admin]
      security: [{ bearer: [] }]
      requestBody: { $ref: '#/components/requestBodies/Reason' }
      responses:
        {
          '200': { $ref: '#/components/responses/PrivilegedRequest' },
          '403': { description: Own request },
          '409': { $ref: '#/components/responses/Problem' },
        }
  /v1/admin/privileged/requests/{requestId}/cancel:
    parameters: [{ $ref: '#/components/parameters/RequestId' }]
    post:
      tags: [admin]
      security: [{ bearer: [] }]
      summary: Requester only, before execution
      requestBody: { $ref: '#/components/requestBodies/Reason' }
      responses:
        {
          '200': { $ref: '#/components/responses/PrivilegedRequest' },
          '403': { description: Not the requester },
          '409': { $ref: '#/components/responses/Problem' },
        }
  /v1/admin/privileged/requests/{requestId}/execute:
    parameters: [{ $ref: '#/components/parameters/RequestId' }]
    post:
      tags: [admin]
      security: [{ bearer: [] }]
      summary: Requester only, within the grant window; runs the stored operation at most once
      requestBody: { $ref: '#/components/requestBodies/Reason' }
      responses:
        {
          '200': { $ref: '#/components/responses/PrivilegedRequest' },
          '403': { description: Not the requester },
          '409':
            {
              description: 'Not approved, expired, already executed, break-glass not yet witnessed, or the operation itself refused (request becomes failed)',
            },
          '423': { description: Platform frozen (operator.grant) },
        }
  /v1/admin/privileged/requests/{requestId}/break-glass:
    parameters: [{ $ref: '#/components/parameters/RequestId' }]
    post:
      tags: [admin]
      security: [{ bearer: [] }]
      summary: Requester self-approves with a fresh code when no second operator is available. Needs external audit anchoring; once per operator per 24 h; 15-minute grant; usable only after the witness acknowledges an anchor covering the approval.
      requestBody: { $ref: '#/components/requestBodies/PrivilegedDecision' }
      responses:
        {
          '200':
            {
              description: 'The request; when the witness did not acknowledge, it carries witness.status and stays unusable until /witness succeeds',
            },
          '409': { $ref: '#/components/responses/Problem' },
        }
  /v1/admin/privileged/requests/{requestId}/witness:
    parameters: [{ $ref: '#/components/parameters/RequestId' }]
    post:
      tags: [admin]
      security: [{ bearer: [] }]
      summary: Retry publishing the external anchor for a break-glass approval
      requestBody: { $ref: '#/components/requestBodies/Reason' }
      responses:
        {
          '200': { $ref: '#/components/responses/PrivilegedRequest' },
          '409': { $ref: '#/components/responses/Problem' },
        }
  /v1/admin/freezes:
    get:
      tags: [admin]
      security: [{ bearer: [] }]
      responses: { '200': { description: '{ items: [{ scope, reason, frozen_by, frozen_at }] }' } }
    post:
      tags: [admin]
      security: [{ bearer: [] }]
      summary: 'Freeze now (restricts only): stops writes that grant or extend access for one organization or the whole platform; reads, device flows, suspension and revocation keep working. Lifting needs a privileged request (org.unfreeze / platform.unfreeze). Refused writes return 423 frozen.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - {
                    type: object,
                    required: [scope, reason],
                    additionalProperties: false,
                    properties:
                      { scope: { type: string, enum: [platform] }, reason: { type: string } },
                  }
                - {
                    type: object,
                    required: [scope, org_id, reason],
                    additionalProperties: false,
                    properties:
                      {
                        scope: { type: string, enum: [organization] },
                        org_id: { type: string },
                        reason: { type: string },
                      },
                  }
      responses:
        {
          '201': { description: The freeze },
          '404': { $ref: '#/components/responses/Problem' },
          '409': { description: Already frozen },
        }

  /v1/organizations/{orgId}/sharing/overview:
    get:
      tags: [sharing]
      summary: Sharing limits (resolved from valid licenses, never client state) and this month's separately metered usage - storage, bandwidth, API mutations, processing, uploads
      security: [{ bearer: [] }]
      parameters:
        - { $ref: '#/components/parameters/OrgId' }
      responses:
        '200': { description: Limits and usage }
        '404': { description: Not a member }
  /v1/organizations/{orgId}/sharing/documents:
    get:
      tags: [sharing]
      summary: List workspace documents (private drafts and exported versions)
      security: [{ bearer: [] }]
      parameters:
        - { $ref: '#/components/parameters/OrgId' }
      responses:
        '200': { description: Documents }
    post:
      tags: [sharing]
      summary: Create a document; optional require_approval gates publication on an independent approval
      security: [{ bearer: [] }]
      parameters:
        - { $ref: '#/components/parameters/OrgId' }
      requestBody: { $ref: '#/components/requestBodies/SharingDocument' }
      responses:
        '201': { description: Created }
  /v1/organizations/{orgId}/sharing/documents/{id}:
    get:
      tags: [sharing]
      summary: Document with draft state, immutable versions, publication and review counts
      security: [{ bearer: [] }]
      parameters:
        - { $ref: '#/components/parameters/OrgId' }
        - {
            name: id,
            in: path,
            required: true,
            schema: { type: string, pattern: '^[a-z]{2,4}_[0-9a-f]{24}$' },
          }
      responses:
        '200': { description: Document }
        '404': { description: Not found }
  /v1/organizations/{orgId}/sharing/documents/{id}/export:
    post:
      tags: [sharing]
      summary: Workflow 1 — create an immutable version from the private draft (quota-checked)
      security: [{ bearer: [] }]
      parameters:
        - { $ref: '#/components/parameters/OrgId' }
        - {
            name: id,
            in: path,
            required: true,
            schema: { type: string, pattern: '^[a-z]{2,4}_[0-9a-f]{24}$' },
          }
      requestBody: { $ref: '#/components/requestBodies/SharingExport' }
      responses:
        '201': { description: Version }
        '409': { description: No ready draft, no changes, or storage over allowance }
  /v1/organizations/{orgId}/sharing/documents/{id}/publish:
    post:
      tags: [sharing]
      summary: Workflows 2/5 — explicitly publish a version; latest links follow only this. With require_approval, needs an approval from someone other than the author
      security: [{ bearer: [] }]
      parameters:
        - { $ref: '#/components/parameters/OrgId' }
        - {
            name: id,
            in: path,
            required: true,
            schema: { type: string, pattern: '^[a-z]{2,4}_[0-9a-f]{24}$' },
          }
      requestBody: { $ref: '#/components/requestBodies/SharingPublish' }
      responses:
        '200': { description: Published version }
        '409': { description: Approval required }
  /v1/organizations/{orgId}/sharing/documents/{id}/delete:
    post:
      tags: [sharing]
      summary: Delete a document; its objects are removed by background jobs once unreferenced
      security: [{ bearer: [] }]
      parameters:
        - { $ref: '#/components/parameters/OrgId' }
        - {
            name: id,
            in: path,
            required: true,
            schema: { type: string, pattern: '^[a-z]{2,4}_[0-9a-f]{24}$' },
          }
      requestBody: { $ref: '#/components/requestBodies/Empty' }
      responses:
        '200': { description: Deleted }
  /v1/organizations/{orgId}/sharing/documents/{id}/versions/{versionId}/review:
    get:
      tags: [sharing]
      summary: Review comments and decisions on a version
      security: [{ bearer: [] }]
      parameters:
        - { $ref: '#/components/parameters/OrgId' }
        - {
            name: id,
            in: path,
            required: true,
