name: CodeQL

on:
  push:
    branches: [main, claude/sleepy-carson-l0if1k]
  pull_request:
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: read
  actions: read # CodeQL reads workflow-run metadata during analysis/upload.
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@v3
