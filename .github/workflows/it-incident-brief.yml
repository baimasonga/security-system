name: IT incident brief

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: it-incident-brief
  cancel-in-progress: false

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Collect fixed public checks
        run: node tools/it-incident-brief.mjs
