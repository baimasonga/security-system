name: CI

on:
  push:
    branches: [main, claude/sleepy-carson-l0if1k]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '43 3 * * 1' # Weekly: detect newly disclosed vulnerabilities without a source push.

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit-witness:
    name: Independent witness adapter and bundle
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ci --prefix infrastructure/audit-witness
      - run: npm --prefix infrastructure/audit-witness test
      - run: npm --prefix infrastructure/audit-witness run build
      - run: npm --prefix infrastructure/audit-witness run audit

  quality:
    name: Format, lint, types, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint # eslint (+security plugin) and architecture boundary checks
      - run: npm run typecheck
      - run: npm test

  portal:
    name: Browser operations workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright-core install --with-deps chromium
      - run: npm run test:portal

  cloudflare:
    name: Cloudflare standby bundle
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --prefix infrastructure/cloudflare
      - run: npm run bundle --prefix infrastructure/cloudflare
      - run: npm audit --prefix infrastructure/cloudflare --audit-level=high
      - name: Build and start the non-root application image
        run: |
          docker build -t warrior-image-check .
          docker run -d --name warrior-image-check -e NODE_ENV=test -p 127.0.0.1:18080:8080 warrior-image-check
          node tools/check-container-image.mjs
      - name: Remove disposable image-check container
        if: always()
        run: docker rm -f warrior-image-check || true

  windows-sdk:
    name: Windows protected-storage integration
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vitest run --project unit packages/sdk-core/test/windows-dpapi.native.test.ts
      - name: Diagnose native failure with a disposable non-secret fixture
        if: failure()
        run: node tools/diagnose-windows-store.ts

  database:
    name: PostgreSQL migration and schema tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:db # owner and least-privilege app-role suites
      - name: Load-test smoke (the tool still works and a light load produces no errors)
        run: |
          # Each scenario seeds fixed identities; never share a populated database.
          node --input-type=module <<'JS'
          import pg from 'pg';
          const client = new pg.Client({ connectionString: process.env.DATABASE_URL });
          await client.connect();
          try {
            await client.query('CREATE DATABASE smoke_activate');
            await client.query('CREATE DATABASE smoke_refresh');
            await client.query('CREATE DATABASE smoke_quota');
          } finally {
            await client.end();
          }
          JS
          DATABASE_URL=postgres://postgres:postgres@localhost:5432/smoke_activate npm run loadtest -- --scenario activate-ramp --users 40 --rps 20 --seconds 4 --assert-clean
          DATABASE_URL=postgres://postgres:postgres@localhost:5432/smoke_refresh npm run loadtest -- --scenario refresh-ramp --users 40 --rps 20 --seconds 4 --assert-clean
          DATABASE_URL=postgres://postgres:postgres@localhost:5432/smoke_quota npm run loadtest -- --scenario quota-ramp --users 20 --quota-limit 20 --rps 20 --seconds 4 --assert-clean

  security:
    name: Dependency and secret scanning
    permissions:
      contents: read
      pull-requests: read # Gitleaks reads the commits belonging to the PR.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # secret scanning needs history
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: npm audit (fails on high+, includes dev dependencies)
        run: npm audit --audit-level=high
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-review:
    name: Dependency review (PRs)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
