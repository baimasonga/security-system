version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      eslint-toolchain:
        patterns:
          - eslint
          - '@eslint/*'
          - typescript-eslint
          - '@typescript-eslint/*'
          - eslint-plugin-security
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
