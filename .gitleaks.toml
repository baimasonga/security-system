title = "Security system secret scanning"

[extend]
useDefault = true

[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
description = "Documented non-secret quota operation ID; no access authority"
condition = "AND"
regexTarget = "secret"
regexes = ['''^unique-operation-id-001$''']
paths = ['''^docs/api/monthly-quotas\.md$''']

[[rules.allowlists]]
description = "SDK quota retry test operation ID; no access authority"
condition = "AND"
regexTarget = "secret"
regexes = ['''^operation_123456789$''']
paths = ['''(^|/)packages/sdk-core/test/quota-client\.test\.ts$''']

[[rules]]
id = "jwt"

[[rules.allowlists]]
description = "Public cross-language update fixtures signed by discarded ephemeral keys; not account tokens"
paths = ['''(^|/)docs/api/update-metadata-vectors\.json$''']

[[rules.allowlists]]
description = "Public root-rotation fixtures signed by discarded ephemeral keys; not account tokens"
paths = ['''(^|/)docs/api/update-root-vectors\.json$''']
